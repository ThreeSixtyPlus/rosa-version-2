<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosa Rose design schemes</title>
<link rel="preconnect" href="https://static.wixstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap">
<style>
:root{
  --rowh:284px;   /* height of one row of photos (desktop) */
  --gap:14px;
  --serif:"Marcellus",Georgia,"Times New Roman",serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:var(--rowh);gap:var(--gap)}
figure{margin:0;position:relative;overflow:hidden;border-radius:2px;background:#E4D3C7}
img{display:block;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
figure:hover img{transform:scale(1.06)}

/* smaller text, and a box that lets a little of the photo show through */
figcaption{
  position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);
  padding:8px 14px;border-radius:14px;
  color:#1D1A19;font:400 clamp(.8rem,1.15vw,.95rem)/1.3 var(--serif);
  background:rgba(247,241,235,.68);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}

/* tablet: two columns */
@media (max-width:768px){
  :root{--rowh:300px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  figcaption{left:8px;bottom:8px;max-width:calc(100% - 16px);padding:6px 10px;font-size:.75rem;border-radius:12px}
}
/* phone: square tiles in two columns */
@media (max-width:480px){
  :root{--rowh:165px}
}
</style>
</head>
<body>
<div class="grid" id="grid" role="list" aria-label="Design schemes">
    <figure><img src="https://static.wixstatic.com/media/ccfa30_22f79b058cd840dda87b755fc02c2d15~mv2.jpg/v1/fill/w_640,h_640,al_c,q_80,enc_auto/ccfa30_22f79b058cd840dda87b755fc02c2d15~mv2.jpg" alt="Living room with a white fireplace, cactus and window-pane mirror" width="640" height="640" loading="eager" decoding="async"><figcaption>A Victorian styled House to play into the original features</figcaption></figure>
    <figure><img src="https://static.wixstatic.com/media/ccfa30_b857245a25854edebca123cfca79cad4~mv2.jpg/v1/fill/w_640,h_640,al_c,q_80,enc_auto/ccfa30_b857245a25854edebca123cfca79cad4~mv2.jpg" alt="Home bar with blue velvet stools and glass shelving" width="640" height="640" loading="eager" decoding="async"><figcaption>Bar and Entertainment Space for the whole family</figcaption></figure>
    <figure><img src="https://static.wixstatic.com/media/ccfa30_ad78092e88504de29dc501408ba97832~mv2.jpg/v1/fill/w_640,h_640,al_c,q_80,enc_auto/ccfa30_ad78092e88504de29dc501408ba97832~mv2.jpg" alt="Navy kitchen with oak cabinets and a pull-out larder" width="640" height="640" loading="eager" decoding="async"><figcaption>The heart of any home, a luxurious kitchen</figcaption></figure>
    <figure><img src="https://static.wixstatic.com/media/ccfa30_50d1c7ec2fd44c2897b4ef3b19c5acea~mv2.jpg/v1/fill/w_640,h_640,al_c,q_80,enc_auto/ccfa30_50d1c7ec2fd44c2897b4ef3b19c5acea~mv2.jpg" alt="Bathroom with a freestanding bath and marble tiles" width="640" height="640" loading="eager" decoding="async"><figcaption>Family Bathroom with feature floating bath</figcaption></figure>
    <figure><img src="https://static.wixstatic.com/media/ccfa30_ff79f4506ab24e8ba1e2d44ad13fb6b7~mv2.jpg/v1/fill/w_640,h_640,al_c,q_80,enc_auto/ccfa30_ff79f4506ab24e8ba1e2d44ad13fb6b7~mv2.jpg" alt="Bedroom with dark floral wallpaper and a crystal chandelier" width="640" height="640" loading="lazy" decoding="async"><figcaption>Cosy Bedroom</figcaption></figure>
    <figure><img src="https://static.wixstatic.com/media/ccfa30_760de4f7f4d84c149fb2f089a08d3741~mv2.jpg/v1/fill/w_640,h_640,al_c,q_80,enc_auto/ccfa30_760de4f7f4d84c149fb2f089a08d3741~mv2.jpg" alt="Loft bedroom with a sloping ceiling and skylight" width="640" height="640" loading="lazy" decoding="async"><figcaption>Bedroom in the Loft</figcaption></figure>
    <figure><img src="https://static.wixstatic.com/media/ccfa30_bf10d69457374610bd0ae611c3531402~mv2.jpg/v1/fill/w_640,h_640,al_c,q_80,enc_auto/ccfa30_bf10d69457374610bd0ae611c3531402~mv2.jpg" alt="Loft home office with a sloping ceiling and linear pendant lights" width="640" height="640" loading="lazy" decoding="async"><figcaption>Compact Home Office</figcaption></figure>
    <figure><img src="https://static.wixstatic.com/media/ccfa30_3d71038cd269439f84867638e6f9bf06~mv2.jpg/v1/fill/w_640,h_640,al_c,q_80,enc_auto/ccfa30_3d71038cd269439f84867638e6f9bf06~mv2.jpg" alt="Hallway with a staircase and a round wooden mirror" width="640" height="640" loading="lazy" decoding="async"><figcaption>Impressive hallway which welcomes you in</figcaption></figure>
</div>
<script>
/* The eight schemes above are the default, so the grid always shows.
   Once Wix sends the list from the DesignSchemes collection, the grid is rebuilt from it,
   so Rosa can change photos and descriptions, reorder, add or remove schemes in the CMS. */
(function(){
  var grid = document.getElementById('grid');
  if (!grid) { return; }
  var ID_OK = /^[A-Za-z0-9_~.-]+$/;
  var BASE = 'https://static.wixstatic.com/media/';
  var currentSig = "ccfa30_22f79b058cd840dda87b755fc02c2d15~mv2.jpg~A Victorian styled House to play into the original features|ccfa30_b857245a25854edebca123cfca79cad4~mv2.jpg~Bar and Entertainment Space for the whole family|ccfa30_ad78092e88504de29dc501408ba97832~mv2.jpg~The heart of any home, a luxurious kitchen|ccfa30_50d1c7ec2fd44c2897b4ef3b19c5acea~mv2.jpg~Family Bathroom with feature floating bath|ccfa30_ff79f4506ab24e8ba1e2d44ad13fb6b7~mv2.jpg~Cosy Bedroom|ccfa30_760de4f7f4d84c149fb2f089a08d3741~mv2.jpg~Bedroom in the Loft|ccfa30_bf10d69457374610bd0ae611c3531402~mv2.jpg~Compact Home Office|ccfa30_3d71038cd269439f84867638e6f9bf06~mv2.jpg~Impressive hallway which welcomes you in";

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function srcFor(id){ return BASE + id + '/v1/fill/w_640,h_640,al_c,q_80,enc_auto/' + id; }

  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.type !== 'schemes' || !Array.isArray(d.items)) { return; }
    var list = d.items.filter(function(it){
      return it && typeof it.id === 'string' && ID_OK.test(it.id);
    }).slice(0, 24);
    if (!list.length) { return; }
    var sig = list.map(function(it){ return it.id + '~' + (it.caption || ''); }).join('|');
    if (sig === currentSig) { return; }
    currentSig = sig;
    grid.innerHTML = list.map(function(it, n){
      var cap = String(it.caption || '').replace(/\s+/g, ' ').trim().slice(0, 120);
      var alt = String(it.alt || cap).replace(/\s+/g, ' ').trim().slice(0, 160);
      return '<figure><img src="' + srcFor(it.id) + '" alt="' + esc(alt) + '" width="640" height="640" loading="' +
        (n < 4 ? 'eager' : 'lazy') + '" decoding="async">' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>';
    }).join('');
  });

  /* tell the Wix page this embed is ready to receive the list */
  try { window.parent.postMessage({ type: 'ready' }, '*'); } catch (err) {}
})();
</script>
</body>
</html>
